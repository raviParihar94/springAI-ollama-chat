spring:
  application:
    name: springAI-ollama-chat
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2:latest
          temperature: 0.7
    chat:
      memory:
        repository:
          jdbc:
            initialization-schema: always
          schema : classpath:/schema-h2db.sql

    mcp:
      server:
        name: webflux-mcp-server
        version: 1.0.0
        type: ASYNC  # Recommended for reactive applications
        instructions: "This reactive server provides weather information tools and resources"
        protocol: STREAMABLE
        capabilities:
          tool: true
          resource: true
          prompt: true
          completion: true
        # sse properties
        sse-message-endpoint: /mcp/messages
        keep-alive-interval: 30s
    vectorstore:
      qdrant:
        host: <qdrant host>
        port: <qdrant grpc port>
        api-key: <qdrant api key>
        collection-name: <collection name>
        content-field-name: <content field name>
        use-tls: false
        initialize-schema: true
  docker:
    compose:
      stop:
        command: down



